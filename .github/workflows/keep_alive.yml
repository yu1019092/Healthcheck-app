name: Keep Streamlit Alive

on:
  schedule:
    # 6時間ごとに実行 (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 手動実行用ボタンを追加

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # -L: リダイレクトを追跡
          # -f: HTTPエラー(400以上)時に失敗として扱う
          # -s: サイレントモード
          curl -sL -f -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" https://healthcheck-app-yu1019092a.streamlit.app/ || echo "Ping failed"
